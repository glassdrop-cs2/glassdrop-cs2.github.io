<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0610">
  <title>GlassDrop — симулятор кейсов CS2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://community.akamai.steamstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=25">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ffc061'/><stop offset='.5' stop-color='%23ff5e3a'/><stop offset='1' stop-color='%239b4dff'/></linearGradient></defs><path d='M16 1.5C16 1.5 4.5 13.6 4.5 20.3a11.5 11.5 0 0 0 23 0C27.5 13.6 16 1.5 16 1.5Z' fill='url(%23g)'/><path d='M10.8 19.4l2.6-3.6 2 3.6zM16.6 19.4l2-3.6 2.6 3.6z' fill='%231b0a24'/><path d='M9.6 22.4c4 3.6 8.8 3.6 12.8 0l-1.6.2-.9 1.3-1.3-1-1.3 1.4-1.3-1.4-1.3 1.4-1.3-1.4-1.3 1-.9-1.3z' fill='%231b0a24'/></svg>">
</head>
<body class="season">
  <div class="bg">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
    <div class="tint" id="tint"></div>
    <div class="bats"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="grain"></div>
  </div>

  <div id="island"></div>

  <header class="topbar glass edge">
    <div class="logo" data-go="#/">
      <div class="logo-drop" id="logoMark"></div>
      <span class="word">Glass<span>Drop</span></span><small>CS2</small>
    </div>
    <div class="site-stats" id="siteStats"></div>
    <nav class="seg" id="nav"></nav>
    <div class="top-right">
      <a class="luck-chip" id="luckChip" href="#/inventory" title="Зелье удачи активно" hidden></a>
      <button class="vitals" id="vitals" title="Самочувствие" hidden></button>
      <a class="lvl-badge" id="lvlBadge" href="#/quests"></a>
      <button class="icon-btn" id="soundBtn" title="Звук"></button>
      <div class="balance" id="balance">
        <span class="bal-num"><span><span class="cur">$</span><span id="balVal">0.00</span></span><small class="uah" id="balUah"></small></span>
        <button class="plus" id="bonusBtn" title="Бонус"></button>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <div class="dock glass edge"><nav class="seg" id="dockNav"></nav></div>

  <footer>Неофициальный фан-симулятор. Валюта и предметы виртуальные, вывода нет — только ради удовольствия.<br>Изображения скинов и кейсов © Valve Corporation. Данные: ByMykel/CSGO-API.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=25"></script>
  <script src="data.js?v=25"></script>
  <script src="rl.js?v=25"></script>
  <script src="app.js?v=25"></script>
</body>
</html>
